<!DOCTYPE html>
<html>

<body>
    <button onclick="go()">点我看剪贴板</button>
    <div id="out" style="white-space:pre-wrap;font-family:monospace;border:1px solid #ccc;padding:10px;margin-top:10px">
        等待中…</div>
    <script>
        async function go() {
            let s = '';
            const items = await navigator.clipboard.read();
            for (const item of items) {
                for (const type of item.types) {
                    const blob = await item.getType(type);
                    const text = await blob.text();
                    s += '\n========== ' + type + ' ==========\n' + text + '\n';
                }
            }
            document.getElementById('out').textContent = s;
        }
    </script>
</body>

</html>
